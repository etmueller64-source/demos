<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathan & Irene </title>
<meta name="description" content=" Portfolio | Lisa K Events|A real wedding planned and designed by Lisa K Events — Nathan & Irene at McLean House.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FDFBF6;
  --ink:#3E3A34;
  --ink-soft:#6E675C;
  --sand:#C3B5A3;
  --sky:#8DB0CF;
  --butter:#FFFDD0;
  --sand-mist:#F1ECE4;
  --sky-mist:#E9F0F7;
  --butter-mist:#FCF4DC;
  --hairline:#DED5C8;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ivory);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:300;
  font-size:17px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
::selection{background:var(--butter);color:var(--ink)}

/* ---------- ribbon stripe (signature) ---------- */
.ribbon{height:7px;display:flex}
.ribbon span{flex:1}
.ribbon span:nth-child(1){background:var(--butter)}
.ribbon span:nth-child(2){background:var(--sky)}
.ribbon span:nth-child(3){background:var(--sand)}
.ribbon span:nth-child(4){background:var(--ivory)}
.ribbon span:nth-child(5){background:var(--sky)}
.ribbon span:nth-child(6){background:var(--butter)}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--sans);
  font-size:12px;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:400;
}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.12}
h1{font-size:clamp(44px,7vw,84px);letter-spacing:.01em}
h2{font-size:clamp(34px,4.6vw,56px)}
h3{font-size:clamp(24px,2.6vw,30px)}
.disp-it{font-style:italic;color:var(--sky)}
.lede{font-size:19px;color:var(--ink-soft);max-width:56ch}

/* ---------- nav ---------- */
header.site{
  position:relative;
  background:var(--ivory);
  padding:24px 5vw 20px;
  border-bottom:1px solid var(--hairline);
}
.navbar{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.wordmark{font-family:var(--serif);font-size:23px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.wordmark small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.5em;color:var(--ink-soft);margin-top:2px;text-transform:uppercase}
nav.main{display:flex;gap:34px;justify-content:center;flex-wrap:wrap}
nav.main a{
  font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:400;
  padding-bottom:4px;border-bottom:1px solid transparent;transition:border-color .3s,color .3s;
}
nav.main a:hover{border-color:var(--sky);color:var(--sky)}
nav.main a.on{border-color:var(--sand)}
.burger{display:none;background:none;border:none;cursor:pointer;padding:8px;position:absolute;right:0;top:50%;transform:translateY(-50%)}
.burger span{display:block;width:26px;height:1px;background:var(--ink);margin:7px 0;transition:.3s}
@media(max-width:900px){
  nav.main{
    display:none;position:fixed;inset:0;background:var(--ivory);
    flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:60;
  }
  nav.main.open{display:flex}
  nav.main a{font-size:15px}
  .burger{display:block;z-index:70;position:relative}
  .burger.x span:nth-child(1){transform:translateY(8px) rotate(45deg)}
  .burger.x span:nth-child(2){opacity:0}
  .burger.x span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
}

/* ---------- buttons ---------- */
.btn{
  display:inline-block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;
  padding:16px 40px;border:1px solid var(--ink);transition:background .35s,color .35s,border-color .35s;
}
.btn:hover{background:var(--ink);color:var(--ivory)}
.btn.ghost{border-color:var(--sand)}
.btn.ghost:hover{background:var(--sand);border-color:var(--sand);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 5vw}
section.blk{padding:110px 0}
@media(max-width:700px){section.blk{padding:70px 0}}
.rule{border:none;border-top:1px solid var(--hairline)}

/* responsive grids */
.g2{display:grid;gap:6vw;align-items:center}
.g2.wide-l{grid-template-columns:1.15fr .85fr}
.g2.wide-r{grid-template-columns:.85fr 1.15fr}
.g2.eq{grid-template-columns:1fr 1fr;gap:36px;align-items:stretch}
.g2.top{align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;align-items:start}
@media(max-width:860px){
  .g2.wide-l,.g2.wide-r,.g2.eq{grid-template-columns:1fr;gap:46px}
  .g3{grid-template-columns:1fr;gap:38px}
  .g2 [style*="sticky"]{position:static!important}
}

/* ---------- photo placeholders ---------- */
.ph{
  position:relative;overflow:hidden;border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.ph::after{
  content:attr(data-label);
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);
  padding:0 18px;letter-spacing:.04em;
}
.ph-a{background:linear-gradient(160deg,var(--sky-mist),var(--sand-mist))}
.ph-b{background:linear-gradient(160deg,var(--butter-mist),var(--sky-mist))}
.ph-c{background:linear-gradient(160deg,var(--sand-mist),var(--butter-mist))}
.r45{aspect-ratio:4/5}
.r34{aspect-ratio:3/4}
.r23{aspect-ratio:2/3}
.r11{aspect-ratio:1/1}
.r32{aspect-ratio:3/2}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}

/* ---------- footer ---------- */
footer.site{background:var(--sand-mist);margin-top:0}
.foot-inner{
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;
  gap:28px;padding:70px 0 50px;
}
.foot-nav{display:flex;gap:26px;flex-wrap:wrap}
.foot-nav a{font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.foot-nav a:hover{color:var(--sky)}
.tiny{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
.tiny a{border-bottom:1px solid var(--sand)}

/* ---------- forms (static demo) ---------- */
.field{margin-bottom:26px}
.field label{
  display:block;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:8px;font-weight:400;
}
.field input,.field textarea,.field select{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--hairline);
  padding:10px 2px;font-family:var(--sans);font-weight:300;font-size:16px;color:var(--ink);
  transition:border-color .3s;border-radius:0;
}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sky)}

.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
@media(max-width:640px){.form2{grid-template-columns:1fr}}

/* focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--sky);outline-offset:3px;
}

/* hero collage */
.hero-collage{position:relative;padding-bottom:46px}
.hero-collage .ph:last-child{position:absolute;right:0;bottom:0;box-shadow:0 30px 60px rgba(62,58,52,.10)}
@media(max-width:860px){
  .wordmark{font-size:20px}
  .hero-collage{max-width:480px}
}

/* mosaic band for inner-page heroes */
.hero-band{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:780px;margin:48px auto 0}
.hero-band .ph{aspect-ratio:4/3;opacity:.9}
@media(max-width:640px){.hero-band{grid-template-columns:repeat(2,1fr)}.hero-band .ph:nth-child(n+3){display:none}}

.ph>img.wx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph.has-img::after{display:none}

</style>
</head>
<body>
<header class="site">
  <div class="navbar">
    <a class="wordmark" href="index.html">Lisa K Events<small>Toronto &middot; Est. Boutique Planning</small></a>
    <nav class="main" id="nav">
    <a href="index.html">Home</a>
    <a href="portfolio.html" class="on">Portfolio</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
    </nav>
    <button class="burger" aria-label="Menu" aria-controls="nav"><span></span><span></span><span></span></button>
  </div>
</header>

<section style="padding:90px 0 70px;background:linear-gradient(175deg,var(--sky-mist),var(--ivory));text-align:center;">
  <div class="wrap">
    <p class="eyebrow rv">A real wedding</p>
    <h1 class="rv" style="margin-top:22px;">Nathan <span class="disp-it">&amp;</span> Irene</h1>
    <p class="tiny rv" style="margin-top:24px;">McLean House</p>
  </div>
</section>

<div class="ribbon" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<section class="blk">
  <div class="wrap">
    <div class="gal">
      <div class="ph ph-c r34 rv has-img" data-label="Room reveal"><img class="wx" src="images/ni-chairs.jpg" alt="Nathan and Irene reception room reveal at McLean House" loading="lazy"></div>
      <div class="ph ph-b r32 rv has-img" data-label="Tablescape"><img class="wx" src="images/ni-tablescape-wide.jpg" alt="Reception tablescape at McLean House" loading="lazy"></div>
      <div class="ph ph-a r34 rv has-img" data-label="Place setting"><img class="wx" src="images/ni-placesetting-rachel.jpg" alt="Wedding place setting with blue and white china" loading="lazy"></div>
      <div class="ph ph-c r34 rv has-img" data-label="Place setting"><img class="wx" src="images/ni-placesetting-groom.jpg" alt="Groom's place setting with candles and florals" loading="lazy"></div>
      <div class="ph ph-b r34 rv has-img" data-label="Florals &amp; candles"><img class="wx" src="images/ni-floral-candles.jpg" alt="Floral and candle details at McLean House" loading="lazy"></div>
      <div class="ph ph-a r34 rv has-img" data-label="Taper candles"><img class="wx" src="images/ni-candles-tall.jpg" alt="Taper candles in blue and white" loading="lazy"></div>
      <div class="ph ph-c r34 rv has-img" data-label="Taper candles"><img class="wx" src="images/ni-candles-close.jpg" alt="Taper candle detail with florals" loading="lazy"></div>
    </div>
    <style>
      .gal{columns:3;column-gap:30px}
      .gal .ph{margin-bottom:30px;break-inside:avoid;width:100%;display:flex}
      @media(max-width:900px){.gal{columns:2}}
      @media(max-width:560px){.gal{columns:1}}
    </style>
  </div>
</section>

<section class="blk" style="padding-top:0;">
  <div class="wrap" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;">
    <a class="btn ghost rv" href="portfolio.html">&larr; Back to portfolio</a>
    <a class="btn rv" href="contact.html">Plan your day</a>
  </div>
</section>

<footer class="site">
  <div class="ribbon" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="wrap foot-inner">
    <div>
      <div class="wordmark" style="font-size:22px">Lisa K Events</div>
      <p class="tiny" style="margin-top:14px">Toronto, Ontario &middot; <a href="mailto:lisa@lisakevents.com">lisa@lisakevents.com</a> &middot; <a href="https://www.instagram.com/lisakevents" rel="noopener">@lisakevents</a></p>
    </div>
    <div class="foot-nav">
      <a href="index.html">Home</a><a href="portfolio.html">Portfolio</a><a href="about.html">About</a><a href="services.html">Services</a><a href="contact.html">Contact</a>
    </div>
    <p class="tiny">&copy; 2026 Lisa K Events</p>
  </div>
</footer>
<script>
(function(){
  var b=document.querySelector('.burger'),n=document.querySelector('nav.main');
  if(b&&n){b.addEventListener('click',function(){n.classList.toggle('open');b.classList.toggle('x');});
    n.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){n.classList.remove('open');b.classList.remove('x');});});}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12});
    document.querySelectorAll('.rv').forEach(function(el){io.observe(el);});
  }else{document.querySelectorAll('.rv').forEach(function(el){el.classList.add('in');});}
})();
</script>
</body>
</html>
